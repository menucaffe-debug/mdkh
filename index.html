const ALL_ITEMS = [...HC, ...CC, ...JU, ...TR, ...SMSH, ...MJ, ...FR, ...SL, ...BF, ...EV, ...DC];
const grid = document.getElementById('grid');

ALL_ITEMS.forEach((item, index) => {
    let priceHtml = '';
    if (item.price) priceHtml = item.price;
    else if (item.prices) priceHtml = item.prices.map(p => p.label + ' ' + p.price).join(' - ');
    else if (item.variants) priceHtml = item.variants.map(v => v.name + ' ' + v.price).join(' - ');
    else if (item.customBox) priceHtml = 'صندوق مخصص';

    const card = document.createElement('div');
    card.className = 'card';
    card.setAttribute('data-cat', item.cat);
    card.style.animationDelay = (index * 0.05) + 's';
    card.onclick = function() { oD(item); };

    card.innerHTML = `
        <div class="ib"><img src="${item.img}" class="ci" loading="lazy" decoding="async"></div>
        <div class="bdy">
            <div class="nar">${item.ar}</div>
            <div class="nen">${item.it}</div>
            <div class="prc">${priceHtml}</div>
        </div>
    `;
    grid.appendChild(card);
});

function fD(cat, btn) {
    document.querySelectorAll('.fb').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
    const cards = grid.querySelectorAll('.card');
    grid.style.opacity = '0';
    grid.style.transform = 'translateY(15px)';
    setTimeout(() => {
        cards.forEach(card => {
            card.style.display = (cat === 'all' || card.dataset.cat === cat) ? 'flex' : 'none';
        });
        grid.style.opacity = '1';
        grid.style.transform = 'translateY(0)';
    }, 300);
}

function oD(item) {
    const dB = document.getElementById('dB');
    const dP = document.getElementById('dP');
    const pI = document.getElementById('pI');
    
    const scrollbarWidth = window.innerWidth - document.documentElement.clientWidth;
    document.documentElement.style.setProperty('--scrollbar-width', `${scrollbarWidth}px`);
    pI.removeAttribute('src');
    
    document.getElementById('pAr').textContent = item.ar || '';
    document.getElementById('pIt').textContent = item.it || '';
    
    const pDs = document.getElementById('pDs');
    if(item.desc) { pDs.textContent = item.desc; pDs.style.display = 'block'; } else { pDs.style.display = 'none'; }
    
    const pNt = document.getElementById('pNt');
    const pPC = document.getElementById('pPC');
    const pP = document.getElementById('pP');
    const pVs = document.getElementById('pVs');
    
    pVs.innerHTML = '';
    pNt.style.display = 'none';
    pPC.style.display = 'none';

    if (item.customBox && item.note) {
        pNt.style.display = 'block'; pNt.className = 'pnt pnt-custom'; pNt.innerHTML = `<div class="pnt-t">${item.note}</div><div class="pnt-h">✦ صندوق مخصص ✦</div>`;
    } else if (item.note) {
        pNt.style.display = 'block'; pNt.className = 'pnt'; pNt.innerHTML = `<div class="pnt-t">${item.note}</div>`;
    }

    if (item.price) {
        pPC.style.display = 'block'; pP.textContent = item.price;
    } else if (item.prices) {
        pPC.style.display = 'none'; pVs.className = 'pvs pvs-center';
        item.prices.forEach(p => { pVs.innerHTML += `<div class="pvi"><span class="pvn">${p.label}</span><span class="sep">•</span><span class="pvpr">${p.price}</span></div>`; });
    } else if (item.variants) {
        pPC.style.display = 'none'; pVs.className = 'pvs pvs-center';
        item.variants.forEach(v => { pVs.innerHTML += `<div class="pvi"><span class="pvn">${v.name}</span><span class="sep">•</span><span class="pvpr">${v.price}</span></div>`; });
    }

    requestAnimationFrame(() => {
        document.body.classList.add('modal-active');
        dB.classList.add!('on');
        dP.classList.add('on');
        setTimeout(() => { if(item.img) pI.src = item.img; }, 50);
    });
}

function cD() {
    const dB = document.getElementById('dB');
    const dP = document.getElementById('dP');
    document.body.classList.remove('modal-active');
    dB.classList.remove('on');
    dP.classList.remove('on');
    document.documentElement.style.setProperty('--scrollbar-width', '0px');
    setTimeout(() => { document.getElementById('pI').removeAttribute('src'); }, 400);
}
